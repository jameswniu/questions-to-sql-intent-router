# Reference data the generators render from. Golden eval facts point at these keys,
# so a fact on the page and the number in the database come from the same place.
as_of: 2026-07-15
coverage: {start: 2024-01-01, end: 2026-06-30}
regions:
  North: {MN: Minnesota, WI: Wisconsin}
  South: {TX: Texas, OK: Oklahoma}
  East: {PA: Pennsylvania, OH: Ohio}
  West: {CO: Colorado, AZ: Arizona}
perils: [water, wind, hail, fire, theft, mold]
editions:
  HO-2023:
    effective_from: 2023-01-01
    effective_to: 2024-12-31
    all_peril_deductible: 1000
    wind_hail_deductible: {type: flat, amount: 1000}
    mold_sublimit: 10000
    roof_settlement: replacement_cost
  HO-2025:
    effective_from: 2025-01-01
    effective_to: null
    all_peril_deductible: 1000
    wind_hail_deductible: {type: percent_of_coverage_a, percent: 2, regions: [West, South], elsewhere_flat: 1000}
    mold_sublimit: 5000
    roof_settlement: actual_cash_value_if_older_than_15_years
facts:
  ho2023_wind_hail_deductible: "$1,000"
  ho2025_wind_hail_deductible_west_south: "2% of Coverage A"
  ho2025_wind_hail_deductible_elsewhere: "$1,000"
  ho2023_mold_sublimit: "$10,000"
  ho2025_mold_sublimit: "$5,000"
  ho2025_roof_acv_age: "15 years"
  flood_excluded: "Flood"
  notice_window: "60 days"
