<path d="M930,211 L964,211" fill="none" stroke="#59636e" stroke-width="2" marker-end="url(#head)"/>
<path d="M350,505 L393,505" fill="none" stroke="#59636e" stroke-width="2" marker-end="url(#head)"/>
<path d="M540,392 L540,448" fill="none" stroke="#59636e" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#head)"/>
<path d="M630,392 L630,424 L860,424 L860,448" fill="none" stroke="#59636e" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#head)"/>
<text x="105" y="285" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" fill="#59636e">turns away</text>
<text x="105" y="313" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" fill="#59636e">off-topic</text>
<text x="295" y="285" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" fill="#59636e">rules first,</text>
<text x="295" y="313" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" fill="#59636e">or asks back</text>
<text x="526" y="428" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" fill="#59636e">as the asker&#x27;s own login</text>
