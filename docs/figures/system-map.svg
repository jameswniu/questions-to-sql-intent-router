<rect x="516" y="136" width="168" height="56" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="600" y="172" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#1f2328">Figures</text>
