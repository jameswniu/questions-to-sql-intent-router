<path d="M390,258 L408,258" fill="none" stroke="#59636e" stroke-width="2" marker-end="url(#head)"/>
<path d="M390,352 L408,352" fill="none" stroke="#59636e" stroke-width="2" marker-end="url(#head)"/>
<path d="M660,70 L680,70" fill="none" stroke="#59636e" stroke-width="2"/>
