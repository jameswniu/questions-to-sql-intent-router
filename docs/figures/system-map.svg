<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 528" width="1200" height="528" role="img" aria-label="A question passes the gate and the router, then the lookup, figures, documents or why path. Every path queries Postgres as the asker's own login, and the why path also uses a sandbox. The verifier checks the draft before the answer. Ingest loads documents and scans into Postgres.">
<defs><marker id="head" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#0969da"/></marker><marker id="head-gray" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#8c959f"/></marker></defs>
<rect width="1200" height="528" fill="#ffffff"/>
