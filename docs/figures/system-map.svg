<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-label="A question passes the gate and the router, takes one of four paths that read Postgres as the asker, and is checked by the verifier before the answer is shown. Documents and scans are ingested into the same database.">
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs>
<rect width="1200" height="590" fill="#ffffff"/>
<rect x="30" y="171" width="150" height="80" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="2"/>
<text x="105" y="219" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">Gate</text>
<rect x="220" y="171" width="150" height="80" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="2"/>
<text x="295" y="219" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">Router</text>
<rect x="410" y="30" width="250" height="80" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/>
<text x="535" y="62" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">Lookup</text>
<text x="535" y="94" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" fill="#59636e">one claim by id</text>
<rect x="410" y="124" width="250" height="80" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/>
<text x="535" y="156" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">Numbers</text>
<text x="535" y="188" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" fill="#59636e">semantic layer</text>
<rect x="410" y="218" width="250" height="80" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/>
<text x="535" y="250" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">Wording</text>
<text x="535" y="282" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" fill="#59636e">hybrid search</text>
<rect x="410" y="312" width="250" height="80" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/>
<text x="535" y="344" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">Why</text>
<text x="535" y="376" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" fill="#59636e">drivers + memos</text>
<rect x="700" y="156" width="230" height="110" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="2"/>
<text x="815" y="187" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">Verifier</text>
<text x="815" y="219" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" fill="#59636e">numbers and</text>
<text x="815" y="251" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" fill="#59636e">citations</text>
<rect x="966" y="171" width="210" height="80" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="2"/>
<text x="1071" y="203" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">Answer</text>
<text x="1071" y="235" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" fill="#59636e">with evidence</text>
<rect x="40" y="450" width="310" height="110" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="2"/>
<text x="195" y="481" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">Ingest</text>
<text x="195" y="513" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" fill="#59636e">docs, notes, scans</text>
<text x="195" y="545" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" fill="#59636e">mask, screen, OCR</text>
<rect x="395" y="450" width="290" height="110" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="2"/>
<text x="540" y="481" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">Postgres</text>
<text x="540" y="513" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" fill="#59636e">claims and chunks</text>
<text x="540" y="545" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" fill="#59636e">row-level security</text>
<rect x="730" y="450" width="260" height="80" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="2"/>
<text x="860" y="482" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">Sandbox</text>
<text x="860" y="514" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" fill="#59636e">no network, 10 s</text>
