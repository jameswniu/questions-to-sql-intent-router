<path d="M684,300 L774,300" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#head-gray)"/>
<path d="M600,348 L600,448" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#head-gray)"/>
<path d="M426,476 L516,476" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#head-gray)"/>
<rect x="24" y="170" width="168" height="56" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="108" y="206" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#1f2328">Gate</text>
