[project]
name = "claims-qa"
version = "0.2.0"
description = "Question answering over a property insurer's claims data, run as the asking user."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.135",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "sqlglot>=26.0",
    "pyyaml>=6.0",
    "fastembed>=0.7",
    "numpy>=2.2",
    "anthropic[vertex]>=1.0",
    "opentelemetry-sdk>=1.30",
    "faker>=37.0",
    "pillow>=11.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
    "mypy>=1.15",
    "httpx>=0.28",
    "pandas>=2.2",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["app", "sandbox", "tests"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs the compose database (make up, or docker compose up -d db init)",
    "sandbox: exercises the sandbox daemon and image",
]
