name: tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Start the stack
        run: make up

      - name: Test suite, in the test container
        run: make test

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.18"
          python-version: "3.13"

      - name: Sandbox limits, on the host where Docker is
        run: make test-sandbox

      - name: Evals match the committed report
        run: make eval-check

      - name: Upload the eval report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: eval-report
          path: evals/report.json
          if-no-files-found: ignore

      - name: Service logs
        if: failure()
        run: docker compose --profile test logs --no-color --timestamps
